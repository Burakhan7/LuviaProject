services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  cv:
    build:
      context: ./cv-service
    ports:
      - "8000:8000"
    volumes:
      - ./cv-service/firebase-key.json:/app/firebase-key.json:ro
      - hf-cache:/root/.cache/huggingface

  api:
    build:
      context: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__Default: "Server=mssql,1433;Database=LuviaDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      CvService__BaseUrl: "http://cv:8000"
    ports:
      - "8080:8080"
    depends_on:
      mssql:
        condition: service_healthy
      cv:
        condition: service_started

volumes:
  mssql-data:
  hf-cache:
